<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clínica-Escola · Sistema (Supabase)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F6F3; --surface:#FFFFFF; --surface-alt:#ECEFEA;
  --ink:#14211D; --ink-soft:#54655D; --ink-faint:#8B978F;
  --primary:#1F6F5C; --primary-dark:#163F35; --primary-soft:#E4EFEA;
  --secondary:#35507A; --secondary-soft:#E7ECF3;
  --ia:#6C4FA6; --ia-soft:#EFE9F8;
  --border:#DDE2DC;
  --amber:#B8791F; --amber-soft:#FBF0DE;
  --red:#B5453B; --red-soft:#FBEAE8;
  --radius:10px; --shadow:0 1px 2px rgba(20,33,29,.06), 0 8px 24px -12px rgba(20,33,29,.12);
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',-apple-system,sans-serif;font-size:14px;line-height:1.5;}
.mono{font-family:'IBM Plex Mono',monospace;}
h1,h2,h3{font-family:'Source Serif 4',Georgia,serif;font-weight:600;margin:0 0 8px;color:var(--primary-dark);}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh;}
.sidebar{background:var(--primary-dark);color:#EAF3EF;padding:20px 16px;display:flex;flex-direction:column;gap:14px;}
.brand{display:flex;align-items:center;gap:8px;padding-bottom:14px;border-bottom:1px solid rgba(255,255,255,.14);}
.brand-mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--primary),#3FA88C);display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-weight:700;font-size:15px;flex-shrink:0;}
.brand-name{font-size:14.5px;font-weight:600;}
.brand-sub{font-size:10.5px;color:#9FC2B4;text-transform:uppercase;letter-spacing:.03em;}
nav{display:flex;flex-direction:column;gap:2px;}
.nav-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:7px;color:#CBE0D6;background:none;border:none;text-align:left;font-size:13.5px;cursor:pointer;font-family:inherit;}
.nav-item:hover{background:rgba(255,255,255,.06);}
.nav-item.active{background:rgba(255,255,255,.14);color:#fff;font-weight:600;}
.sidebar-note{margin-top:auto;font-size:11px;color:#9FC2B4;line-height:1.4;padding-top:14px;border-top:1px solid rgba(255,255,255,.1);}
main{padding:26px 34px 60px;max-width:1180px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px;margin-bottom:16px;box-shadow:var(--shadow);}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.eyebrow{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-faint);margin-bottom:3px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;}
.field label{font-size:11.5px;color:var(--ink-soft);font-weight:500;}
.field input,.field textarea,.field select{border:1px solid var(--border);border-radius:7px;padding:8px 10px;font-family:inherit;font-size:13px;background:#FCFDFC;color:var(--ink);}
.field textarea{resize:vertical;min-height:56px;}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:9px 16px;font-size:13px;font-weight:500;border:1px solid transparent;cursor:pointer;font-family:inherit;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary-dark);}
.btn-ghost{background:var(--surface);border-color:var(--border);color:var(--ink);}
.btn-ghost:hover{background:var(--surface-alt);}
.btn-danger{background:var(--red-soft);color:var(--red);border-color:#EAC7C2;}
.btn-sm{padding:5px 10px;font-size:12px;}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:500;padding:3px 9px;border-radius:99px;}
.badge-wait{background:var(--amber-soft);color:var(--amber);}
.badge-progress{background:var(--secondary-soft);color:var(--secondary);}
.badge-done{background:var(--primary-soft);color:var(--primary-dark);}
.badge-code{background:var(--surface-alt);color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);padding:0 10px 8px;border-bottom:1px solid var(--border);font-weight:600;}
td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:top;}
tr:last-child td{border-bottom:none;}
tr.clickable{cursor:pointer;}
tr.clickable:hover{background:var(--surface-alt);}
.muted{color:var(--ink-faint);font-size:12.5px;}
.divider{height:1px;background:var(--border);margin:14px 0;}
.pill-select{display:flex;gap:8px;margin-bottom:14px;}
.pill-select button{flex:1;padding:9px;border-radius:8px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-family:inherit;font-size:13px;}
.pill-select button.active{background:var(--primary);color:#fff;border-color:var(--primary);}
.toast{position:fixed;bottom:20px;right:20px;background:var(--primary-dark);color:#fff;padding:12px 18px;border-radius:8px;font-size:13px;box-shadow:var(--shadow);opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none;z-index:50;}
.toast.show{opacity:1;transform:translateY(0);}

/* stomatograma */
.stoma-wrap{display:flex;gap:24px;flex-wrap:wrap;}
.stoma-svg-box{flex:1;min-width:520px;}
.region{stroke:#7A5A55;stroke-width:1.5;fill:#F1E6E2;cursor:pointer;transition:.15s;}
.region:hover{fill:#E7C9C0;}
.region.has-lesao{fill:#F3D2CC;stroke:#B5453B;stroke-width:2;}
.region.selected{fill:#D8C4EF;stroke:#6C4FA6;stroke-width:2.2;}
.stoma-lbl{font-size:12px;fill:#3A2A27;font-family:'IBM Plex Sans',sans-serif;}
.stoma-title{font-weight:bold;font-size:13px;fill:#123830;}
.lesoes-panel{width:320px;}
.lesao-item{border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px;font-size:12.5px;}
.lesao-item .rgn{font-weight:600;color:var(--ia);}
.empty-state{color:var(--ink-faint);font-size:12.5px;padding:20px;text-align:center;}

</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">C</div>
      <div>
        <div class="brand-name">Clínica-Escola</div>
        <div class="brand-sub">Supabase · nuvem</div>
      </div>
    </div>
    <nav>
      <button class="nav-item" data-view="pacientes">Pacientes</button>
      <button class="nav-item" data-view="atendimento">Atendimento</button>
      <button class="nav-item" data-view="stomatograma">Estomatograma</button>
      <button class="nav-item" data-view="encaminhamentos">Encaminhamentos</button>
      <button class="nav-item" data-view="auditoria">Auditoria</button>
    </nav>
    <div class="field" style="margin-top:6px">
      <label style="color:#9FC2B4">Seu nome (aparece na auditoria)</label>
      <input id="usuario-atual" placeholder="ex.: Lucas Martins" style="background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2);color:#EAF3EF;">
    </div>
    <div class="sidebar-note" id="conn-status">Verificando conexão com o Supabase...</div>
  </aside>
  <main id="main"></main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script>
// ============================================================
// CONFIGURAÇÃO — cole aqui a URL e a chave do SEU projeto Supabase.
// Onde achar: painel do Supabase → seu projeto → Settings (ícone de
// engrenagem) → API. Copie "Project URL" e a chave "anon public".
// NUNCA cole a chave "service_role" (secreta) — só a "anon public".
// ============================================================
const SUPABASE_URL = "https://jlfowtzkgtgnvquzroxb.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_u1oN0kRN6niw1gcHiO8n2g_77gD_F95";

</script>
<script>
// ============================================================
// Cliente Supabase — todas as chamadas ao "banco" acontecem daqui,
// direto do navegador para a nuvem. Não existe mais servidor local.
// ============================================================

// Mostra qualquer erro de forma bem visível na tela — nunca falha em silêncio.
function showFatalError(msg) {
  const status = document.getElementById('conn-status');
  if (status) { status.textContent = '⚠ ' + msg; status.style.color = '#E3B45A'; }
  const main = document.getElementById('main');
  if (main) {
    main.innerHTML = `<div class="card"><h2 style="color:#B5453B">Não foi possível carregar o sistema</h2>
      <p style="font-family:'IBM Plex Sans',sans-serif;font-size:13.5px;color:#54655D;line-height:1.6;">${msg}</p></div>`;
  }
}
// Rede de segurança: qualquer erro não previsto, em qualquer parte do app, aparece na tela.
window.addEventListener('error', (e) => showFatalError('Erro: ' + (e.message || e.error || 'desconhecido')));
window.addEventListener('unhandledrejection', (e) => showFatalError('Erro: ' + (e.reason && e.reason.message ? e.reason.message : e.reason)));

let sbClient = null;
let initError = null;
try {
  if (typeof window.supabase === 'undefined') {
    initError = 'A biblioteca do Supabase não carregou. Isso normalmente acontece por falta de conexão com a internet no momento em que a página abriu (ela precisa baixar um arquivo externo). Verifique sua internet e recarregue a página (F5).';
  } else if (typeof SUPABASE_URL === 'undefined' || typeof SUPABASE_ANON_KEY === 'undefined') {
    initError = 'O arquivo supabase-config.js não foi carregado. Confira se ele está na mesma pasta que o index.html e se o nome está exatamente "supabase-config.js" (não "supabase-config.js.txt").';
  } else if (SUPABASE_URL.includes('COLE_AQUI') || SUPABASE_ANON_KEY.includes('COLE_AQUI')) {
    initError = 'Configure o arquivo supabase-config.js com a URL e a chave "anon public" do seu projeto Supabase.';
  } else {
    sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }
} catch (e) {
  initError = 'Falha ao iniciar o Supabase: ' + e.message;
}

const state = {
  view: 'pacientes',
  especialidades: [],
  regioes: [],
  pacienteAtual: null,
  atendimentoAtual: null,
};

const $main = document.getElementById('main');

function toast(msg) {
  let t = document.querySelector('.toast');
  if (!t) { t = document.createElement('div'); t.className = 'toast'; document.body.appendChild(t); }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2200);
}

function usuarioAtual() {
  const v = document.getElementById('usuario-atual').value.trim();
  return v || 'sistema';
}

// Envolve toda chamada ao Supabase: já trata erro de forma consistente.
async function sb(promise) {
  const { data, error } = await promise;
  if (error) { toast('Erro: ' + error.message); throw error; }
  return data;
}

async function checarConexao() {
  const el = document.getElementById('conn-status');
  try {
    const { error } = await sbClient.from('especialidades').select('id').limit(1);
    if (error) throw error;
    el.textContent = '✓ Conectado ao Supabase.';
    return true;
  } catch (e) {
    el.textContent = '⚠ Não foi possível conectar: ' + (e.message || e) + ' — confira a URL/chave e se o script SQL foi rodado.';
    el.style.color = '#E3B45A';
    return false;
  }
}

// ---------- auditoria ----------
async function logAcao(acao, entidade, entidade_id) {
  await sb(sbClient.from('auditoria').insert({ usuario: usuarioAtual(), acao, entidade, entidade_id }));
}
async function logCampo(atendimento_id, campo, valorAnterior, valorNovo) {
  const antes = valorAnterior === undefined || valorAnterior === null ? '' : String(valorAnterior);
  const depois = valorNovo === undefined || valorNovo === null ? '' : String(valorNovo);
  if (antes === depois) return;
  await sb(sbClient.from('auditoria').insert({
    usuario: usuarioAtual(), acao: 'alterou_campo', entidade: 'atendimento',
    entidade_id: atendimento_id, atendimento_id, campo, valor_anterior: antes, valor_novo: depois,
  }));
}

function setActiveNav() {
  document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.view === state.view));
}
async function go(view) {
  state.view = view;
  setActiveNav();
  if (view === 'pacientes') await renderPacientes();
  else if (view === 'atendimento') await renderAtendimento();
  else if (view === 'stomatograma') await renderStomatograma();
  else if (view === 'encaminhamentos') await renderEncaminhamentos();
  else if (view === 'auditoria') await renderAuditoria();
}
document.querySelectorAll('.nav-item').forEach(b => b.addEventListener('click', () => { if (sbClient) go(b.dataset.view); }));

async function ensureEspecialidades() {
  if (!state.especialidades.length) {
    state.especialidades = await sb(sbClient.from('especialidades').select('*').eq('ativo', true).order('nome'));
  }
}
async function ensureRegioes() {
  if (!state.regioes.length) {
    state.regioes = await sb(sbClient.from('regioes_stomatograma').select('*').order('painel').order('id'));
  }
}

// ============================= PACIENTES =============================
async function renderPacientes() {
  const lista = await sb(sbClient.from('pacientes').select('*').order('id', { ascending: false }).limit(50));
  $main.innerHTML = `
    <div class="eyebrow">Cadastro</div>
    <h2>Pacientes</h2>

    <div class="card">
      <div class="card-head"><h3 style="margin:0">Buscar</h3></div>
      <div class="field"><input id="busca-paciente" placeholder="Nome, código ou CPF"></div>
      <table id="tbl-pacientes">
        <tr><th>Código</th><th>Nome</th><th>CPF</th><th></th></tr>
        ${listaPacientesRows(lista)}
      </table>
    </div>

    <div class="card">
      <div class="card-head"><h3 style="margin:0">Novo cadastro</h3></div>
      <div class="muted" style="margin-bottom:10px">Campos da Ficha SUS de identificação. Depois de salvar, abra o paciente para preencher a Anamnese (identificação complementar, histórico médico e exame físico).</div>
      <div class="grid2">
        <div class="field"><label>Nome completo</label><input id="p-nome" placeholder="Nome fictício"></div>
        <div class="field"><label>CPF</label><input id="p-cpf" placeholder="000.000.000-00"></div>
        <div class="field"><label>Data de nascimento</label><input id="p-nasc" placeholder="dd/mm/aaaa"></div>
        <div class="field"><label>Sexo</label>
          <select id="p-sexo"><option value="">Selecione...</option><option>Feminino</option><option>Masculino</option></select>
        </div>
        <div class="field"><label>Cor/etnia</label>
          <select id="p-cor-etnia">
            <option value="">Selecione...</option>
            <option>Leucoderma</option><option>Feoderma</option><option>Melanoderma</option><option>Xantoderma</option><option>Indígena</option>
          </select>
        </div>
        <div class="field"><label>Cartão Nacional de Saúde (CNS)</label><input id="p-cns"></div>
        <div class="field"><label>Telefone</label><input id="p-tel"></div>
        <div class="field"><label>Município</label><input id="p-municipio"></div>
        <div class="field" style="grid-column:1/-1"><label>Endereço</label><input id="p-end"></div>
      </div>
      <button class="btn btn-primary" id="btn-criar-paciente">Salvar cadastro</button>
    </div>

    <div id="detalhe-paciente"></div>
  `;

  document.getElementById('busca-paciente').addEventListener('input', async (e) => {
    const q = e.target.value.replace(/[,()%]/g, '').trim();
    let rows;
    if (q) {
      rows = await sb(sbClient.from('pacientes').select('*')
        .or(`nome.ilike.%${q}%,codigo.ilike.%${q}%,cpf.ilike.%${q}%`)
        .order('id', { ascending: false }));
    } else {
      rows = await sb(sbClient.from('pacientes').select('*').order('id', { ascending: false }).limit(50));
    }
    document.getElementById('tbl-pacientes').innerHTML = `<tr><th>Código</th><th>Nome</th><th>CPF</th><th></th></tr>${listaPacientesRows(rows)}`;
    wireAbrirPaciente();
  });

  document.getElementById('btn-criar-paciente').addEventListener('click', async () => {
    const nome = document.getElementById('p-nome').value.trim();
    if (!nome) { toast('Informe o nome do paciente'); return; }
    const criado = await sb(sbClient.from('pacientes').insert({
      nome, cpf: v('p-cpf'), data_nascimento: v('p-nasc'), telefone: v('p-tel'), endereco: v('p-end'),
      sexo: v('p-sexo'), cor_etnia: v('p-cor-etnia'), cns: v('p-cns'), municipio: v('p-municipio'),
    }).select().single());
    await logAcao('criou', 'paciente', criado.id);
    toast('Paciente cadastrado');
    renderPacientes();
  });

  wireAbrirPaciente();
}

function listaPacientesRows(lista) {
  return lista.map(p => `
    <tr class="clickable" data-id="${p.id}">
      <td class="mono">${p.codigo}</td><td>${p.nome}</td><td>${p.cpf || '—'}</td>
      <td><button class="btn btn-ghost btn-sm" data-abrir="${p.id}">Abrir</button></td>
    </tr>`).join('') || `<tr><td colspan="4" class="empty-state">Nenhum paciente cadastrado ainda.</td></tr>`;
}

function wireAbrirPaciente() {
  document.querySelectorAll('[data-abrir]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      await abrirProntuario(btn.dataset.abrir);
    });
  });
}

async function abrirProntuario(pacienteId) {
  const paciente = await sb(sbClient.from('pacientes').select('*').eq('id', pacienteId).single());
  const atendimentos = await sb(sbClient.from('atendimentos')
    .select('*, especialidades(nome)').eq('paciente_id', pacienteId).order('id', { ascending: false }));
  const encaminhamentos = await sb(sbClient.from('encaminhamentos')
    .select('*').eq('paciente_id', pacienteId).order('id', { ascending: false }));
  const documentosGerais = await sb(sbClient.from('documentos')
    .select('*').eq('paciente_id', pacienteId).is('atendimento_id', null).order('id', { ascending: false }));
  const anamnese = await fetchAnamnese(pacienteId);
  state.pacienteAtual = paciente;

  const box = document.getElementById('detalhe-paciente');
  box.innerHTML = `
    <div class="card">
      <div class="card-head">
        <h3 style="margin:0">${paciente.nome} <span class="badge badge-code mono">${paciente.codigo}</span> ${anamnese ? '' : '<span class="badge badge-wait">Anamnese pendente</span>'}</h3>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn btn-ghost btn-sm" id="editar-cadastro">Editar cadastro</button>
          <button class="btn btn-ghost btn-sm" id="ir-anamnese">${anamnese ? 'Ver/editar anamnese' : 'Preencher anamnese'}</button>
          <button class="btn btn-ghost btn-sm" id="baixar-ficha-completa">Baixar ficha completa (PDF)</button>
          <button class="btn btn-primary btn-sm" id="ir-atendimento">Novo atendimento</button>
        </div>
      </div>
      <div class="grid3">
        <div><div class="muted">CPF</div><div>${paciente.cpf || '—'}</div></div>
        <div><div class="muted">Nascimento</div><div>${paciente.data_nascimento || '—'}${paciente.sexo ? ' · ' + paciente.sexo : ''}</div></div>
        <div><div class="muted">Cor/etnia</div><div>${paciente.cor_etnia || '—'}</div></div>
        <div><div class="muted">CNS</div><div>${paciente.cns || '—'}</div></div>
        <div><div class="muted">Telefone</div><div>${paciente.telefone || '—'}</div></div>
        <div><div class="muted">Município</div><div>${paciente.municipio || '—'}</div></div>
      </div>
      <div class="muted" style="font-size:11px;margin-top:2px;">Alergias, comorbidades, medicamentos e hábitos ficam na Anamnese do paciente (preenchida uma única vez, na triagem) — não mais em cada atendimento.</div>
      <div class="divider"></div>
      <div class="muted" style="margin-bottom:8px">Prontuário · histórico de atendimentos (clique para abrir)</div>
      <table>
        <tr><th>Sessão</th><th>Especialidade</th><th>Status</th><th>Data</th></tr>
        ${atendimentos.map(a => `
          <tr class="clickable" data-atendimento="${a.id}">
            <td class="mono">${a.numero_sessao}</td><td>${a.especialidades?.nome || '—'}</td>
            <td>${badgeStatusAtendimento(a)}</td><td>${a.criado_em}</td>
          </tr>`).join('') || `<tr><td colspan="4" class="empty-state">Nenhum atendimento ainda.</td></tr>`}
      </table>
      <div class="divider"></div>
      <div class="muted" style="margin-bottom:8px">Encaminhamentos relacionados a este paciente</div>
      <table>
        <tr><th>Origem</th><th>Responsável / unidade</th><th>Status</th><th>Data</th></tr>
        ${encaminhamentos.map(en => `
          <tr>
            <td><span class="badge ${en.origem_tipo === 'ubs' ? 'badge-progress' : 'badge-done'}">${en.origem_tipo === 'ubs' ? 'UBS' : 'Clínica particular'}</span></td>
            <td>${en.nome_origem || '—'}</td><td>${en.status}</td><td>${en.criado_em}</td>
          </tr>`).join('') || `<tr><td colspan="4" class="empty-state">Nenhum encaminhamento para este paciente ainda.</td></tr>`}
      </table>
    </div>
    <div class="card">
      <div class="muted" style="margin-bottom:8px">Documentos do paciente (não vinculados a um atendimento específico)</div>
      <div id="docs-paciente-lista">${renderDocumentosCards(documentosGerais)}</div>
      <div class="divider"></div>
      ${formularioUploadHtml('doc-pac', null)}
    </div>
    <div id="atendimento-detalhe"></div>
  `;
  document.getElementById('ir-atendimento').addEventListener('click', () => go('atendimento'));
  document.getElementById('editar-cadastro').addEventListener('click', () => abrirEdicaoPaciente(pacienteId));
  document.getElementById('ir-anamnese').addEventListener('click', () => abrirAnamnese(pacienteId));
  document.getElementById('baixar-ficha-completa').addEventListener('click', (e) => {
    e.target.disabled = true; e.target.textContent = 'Gerando...';
    gerarRelatorioCompletoPaciente(pacienteId).finally(() => { e.target.disabled = false; e.target.textContent = 'Baixar ficha completa (PDF)'; });
  });
  document.querySelectorAll('[data-atendimento]').forEach(tr => {
    tr.addEventListener('click', () => abrirAtendimentoDetalhe(tr.dataset.atendimento, pacienteId));
  });
  wireUploadForm('doc-pac', { paciente_id: pacienteId, atendimento_id: null }, () => abrirProntuario(pacienteId));
  wireDocumentosCards(documentosGerais, () => abrirProntuario(pacienteId));
}

function escAttr(s) { return s === null || s === undefined ? '' : String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;'); }
function escHtml(s) { return s === null || s === undefined ? '' : String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

// ---------- helpers de anamnese (campos sim/não/não-informado) ----------
function selSimNao(id, valorAtual) {
  return `<select id="${id}">
    <option value="">Não informado</option>
    <option value="sim" ${valorAtual === true ? 'selected' : ''}>Sim</option>
    <option value="nao" ${valorAtual === false ? 'selected' : ''}>Não</option>
  </select>`;
}
function vBool(id) {
  const val = document.getElementById(id).value;
  if (val === 'sim') return true;
  if (val === 'nao') return false;
  return null;
}
function simNaoTexto(valor) { return valor === true ? 'Sim' : valor === false ? 'Não' : '—'; }
function campoDoenca(id, label, val) {
  return `<div class="field"><label>${label}</label>${selSimNao(id, val)}</div>`;
}
async function fetchAnamnese(pacienteId) {
  return await sb(sbClient.from('anamneses').select('*').eq('paciente_id', pacienteId).maybeSingle());
}
// Resumo compacto (alertas + link) usado tanto na tela de Atendimento quanto no prontuário.
function renderResumoAnamneseHtml(anamnese, pacienteId) {
  if (!anamnese) {
    return `<div class="badge badge-wait" style="margin-bottom:8px;">Anamnese ainda não preenchida</div>
      <div><button class="btn btn-ghost btn-sm" data-ir-anamnese="${pacienteId}">Preencher anamnese agora</button></div>`;
  }
  const alertas = [];
  if (anamnese.doenca_alergia) alertas.push('Alergia' + (anamnese.doenca_alergia_qual ? ': ' + anamnese.doenca_alergia_qual : ''));
  if (anamnese.medicamento_atual) alertas.push('Em uso de medicamento' + (anamnese.medicamento_atual_qual ? ': ' + anamnese.medicamento_atual_qual : ''));
  if (anamnese.doenca_cardiopatia) alertas.push('Cardiopatia');
  if (anamnese.doenca_diabete) alertas.push('Diabete');
  if (anamnese.doenca_hemorragia || anamnese.transfusao_sanguinea) alertas.push('Histórico de hemorragia/transfusão');
  if (anamnese.esta_gravida) alertas.push('Gestante');
  return `
    <div class="grid2">
      <div>
        <div class="muted" style="margin-bottom:4px;">Alertas da anamnese</div>
        ${alertas.length ? alertas.map(a => `<span class="badge badge-wait" style="margin:2px 6px 2px 0;">${a}</span>`).join('') : '<span class="muted">Nenhum alerta relevante registrado</span>'}
      </div>
      <div style="text-align:right;"><button class="btn btn-ghost btn-sm" data-ir-anamnese="${pacienteId}">Ver anamnese completa</button></div>
    </div>`;
}
function wireResumoAnamneseLinks(container) {
  container.querySelectorAll('[data-ir-anamnese]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const pid = btn.dataset.irAnamnese;
      await go('pacientes');
      await abrirProntuario(pid);
      await abrirAnamnese(pid);
    });
  });
}

async function logCampoPaciente(paciente_id, campo, valorAnterior, valorNovo) {
  const antes = valorAnterior === undefined || valorAnterior === null ? '' : String(valorAnterior);
  const depois = valorNovo === undefined || valorNovo === null ? '' : String(valorNovo);
  if (antes === depois) return;
  await sb(sbClient.from('auditoria').insert({
    usuario: usuarioAtual(), acao: 'alterou_campo', entidade: 'paciente',
    entidade_id: paciente_id, atendimento_id: null, campo, valor_anterior: antes, valor_novo: depois,
  }));
}

// Permite corrigir erros de digitação na Ficha SUS do paciente após o cadastro.
async function abrirEdicaoPaciente(pacienteId) {
  const paciente = await sb(sbClient.from('pacientes').select('*').eq('id', pacienteId).single());
  const box = document.getElementById('detalhe-paciente');
  box.innerHTML = `
    <div class="card">
      <div class="card-head">
        <h3 style="margin:0">Editar cadastro <span class="badge badge-code mono">${paciente.codigo}</span></h3>
      </div>
      <div class="muted" style="margin-bottom:10px">Para corrigir erros de digitação na Ficha SUS. As alterações ficam registradas na auditoria.</div>
      <div class="grid3">
        <div class="field" style="grid-column:1/-1"><label>Nome completo</label><input id="pe-nome" value="${escAttr(paciente.nome)}"></div>
        <div class="field"><label>CPF</label><input id="pe-cpf" value="${escAttr(paciente.cpf)}"></div>
        <div class="field"><label>Data de nascimento</label><input id="pe-nasc" value="${escAttr(paciente.data_nascimento)}"></div>
        <div class="field"><label>Sexo</label>
          <select id="pe-sexo">
            <option value="">Selecione...</option>
            ${['Masculino', 'Feminino'].map(o => `<option ${paciente.sexo === o ? 'selected' : ''}>${o}</option>`).join('')}
          </select>
        </div>
        <div class="field"><label>Cor/etnia</label>
          <select id="pe-cor-etnia">
            <option value="">Selecione...</option>
            ${['Leucoderma', 'Feoderma', 'Melanoderma', 'Xantoderma', 'Indígena'].map(o => `<option ${paciente.cor_etnia === o ? 'selected' : ''}>${o}</option>`).join('')}
          </select>
        </div>
        <div class="field"><label>Cartão Nacional de Saúde (CNS)</label><input id="pe-cns" value="${escAttr(paciente.cns)}"></div>
        <div class="field"><label>Telefone</label><input id="pe-tel" value="${escAttr(paciente.telefone)}"></div>
        <div class="field" style="grid-column:1/-1"><label>Endereço</label><input id="pe-end" value="${escAttr(paciente.endereco)}"></div>
        <div class="field"><label>Município</label><input id="pe-municipio" value="${escAttr(paciente.municipio)}"></div>
      </div>
      <button class="btn btn-primary" id="btn-salvar-paciente">Salvar alterações</button>
      <button class="btn btn-ghost" id="btn-cancelar-edicao-paciente">Cancelar</button>
    </div>`;

  document.getElementById('btn-cancelar-edicao-paciente').addEventListener('click', () => abrirProntuario(pacienteId));
  document.getElementById('btn-salvar-paciente').addEventListener('click', async () => {
    const payload = {
      nome: v('pe-nome'), cpf: v('pe-cpf'), data_nascimento: v('pe-nasc'), sexo: v('pe-sexo'),
      cor_etnia: v('pe-cor-etnia'), cns: v('pe-cns'), telefone: v('pe-tel'), endereco: v('pe-end'), municipio: v('pe-municipio'),
    };
    if (!payload.nome) { toast('Nome não pode ficar em branco'); return; }
    for (const [campo, novo] of Object.entries(payload)) {
      await logCampoPaciente(pacienteId, campo, paciente[campo], novo);
    }
    await sb(sbClient.from('pacientes').update(payload).eq('id', pacienteId));
    toast('Cadastro atualizado');
    abrirProntuario(pacienteId);
  });
}

function badgeStatusAtendimento(a) {
  if (a.status === 'concluido') return `<span class="badge badge-done">Concluído${a.concluido_em ? ' · ' + a.concluido_em : ''}</span>`;
  return `<span class="badge badge-progress">${a.status === 'aguardando' ? 'Aguardando' : 'Em andamento'}</span>`;
}

  const lesoes = await sb(sbClient.from('lesoes_estomatologicas')
    .select('*, regioes_stomatograma(nome, lado, painel)').eq('atendimento_id', atendimentoId).order('id', { ascending: false }));
  const logs = await sb(sbClient.from('auditoria').select('*').eq('atendimento_id', atendimentoId).order('id', { ascending: false }));
  const documentos = await sb(sbClient.from('documentos').select('*').eq('atendimento_id', atendimentoId).order('id', { ascending: false }));
  const dentesProc = await sb(sbClient.from('procedimentos_dente').select('*').eq('atendimento_id', atendimentoId).order('id'));

  const editavel = a.status !== 'concluido';

          <button class="btn btn-ghost btn-sm" id="ir-stoma-detalhe" style="margin-top:8px">Abrir Estomatograma deste atendimento</button>
        ` : ''}

        <div id="docs-atendimento-lista">${renderDocumentosCards(documentos)}</div>

          `).join('') || `<tr><td colspan="5" class="empty-state">Nenhuma alteração registrada ainda neste atendimento.</td></tr>`}
        </table>

  }

  wireResumoAnamneseLinks(box);
  document.getElementById('voltar-prontuario').addEventListener('click', () => abrirProntuario(pacienteId));
  document.getElementById('baixar-relatorio-atendimento').addEventListener('click', (e) => {

  });
  const stomaBtn = document.getElementById('ir-stoma-detalhe');
  if (stomaBtn) stomaBtn.addEventListener('click', () => { state.atendimentoAtual = { id: a.id }; go('stomatograma'); });
  wireUploadForm('doc-atd', { paciente_id: pacienteId, atendimento_id: atendimentoId }, () => abrirAtendimentoDetalhe(atendimentoId, pacienteId));
  wireDocumentosCards(documentos, () => abrirAtendimentoDetalhe(atendimentoId, pacienteId));

  const btnConcluir = document.getElementById('btn-concluir-atendimento');
  if (btnConcluir) btnConcluir.addEventListener('click', async () => {
    if (!confirm('Concluir este atendimento? Ele deixa de poder ser editado até ser reaberto.')) return;
    await sb(sbClient.from('atendimentos').update({ status: 'concluido', concluido_em: new Date().toISOString() }).eq('id', atendimentoId));
    await logAcao('concluiu', 'atendimento', atendimentoId);
    toast('Atendimento concluído');
    abrirAtendimentoDetalhe(atendimentoId, pacienteId);
  });
  const btnReabrir = document.getElementById('btn-reabrir-atendimento');
  if (btnReabrir) btnReabrir.addEventListener('click', async () => {
    await sb(sbClient.from('atendimentos').update({ status: 'em_atendimento', concluido_em: null }).eq('id', atendimentoId));
    await logAcao('reabriu', 'atendimento', atendimentoId);

    abrirAtendimentoDetalhe(atendimentoId, pacienteId);

  if (editavel) {
    document.getElementById('ea-dp-add').addEventListener('click', async () => {

      await logAcao('adicionou', 'procedimento_dente', atendimentoId);
      abrirAtendimentoDetalhe(atendimentoId, pacienteId);
    });
    document.querySelectorAll('[data-del-dp]').forEach(btn => {
      btn.addEventListener('click', async () => {
        await sb(sbClient.from('procedimentos_dente').delete().eq('id', btn.dataset.delDp));
        await logAcao('removeu', 'procedimento_dente', atendimentoId);
        abrirAtendimentoDetalhe(atendimentoId, pacienteId);
      });
    });
    document.getElementById('btn-salvar-atendimento').addEventListener('click', async () => {
      const payload = {
        especialidade_id: document.getElementById('ea-especialidade').value,
        clinica: v('ea-clinica'), horario: v('ea-horario'), tipo_consulta: v('ea-tipo-consulta'),
        prontuario_sus: v('ea-prontuario-sus'), aluno: v('ea-aluno'), aluno_ra: v('ea-aluno-ra'),
        professor: v('ea-professor'), cd_responsavel: v('ea-cd'), responsavel_preenchimento: v('ea-responsavel'),
        assinatura_coletada: document.getElementById('ea-assinatura').checked,
        queixa_principal: v('ea-queixa'), hda: v('ea-hda'),
        achados_clinicos: v('ea-achados'), procedimentos: v('ea-procedimentos'), evolucao: v('ea-evolucao'),
        hipotese_diagnostica: v('ea-hipotese'), diagnostico: v('ea-diagnostico'),
      };
      for (const [campo, novo] of Object.entries(payload)) {
        await logCampo(atendimentoId, campo, a[campo], novo);
      }
      await sb(sbClient.from('atendimentos').update(payload).eq('id', atendimentoId));
      toast('Atendimento atualizado');
      abrirAtendimentoDetalhe(atendimentoId, pacienteId);
    });
  }
}

// ============================= RELATÓRIOS EM PDF =============================
// Gera um PDF de verdade (texto estruturado), não uma captura da tela.

function slugNomeArquivo(s) {
  return String(s || 'paciente').normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-zA-Z0-9]+/g, '_').replace(/^_+|_+$/g, '') || 'paciente';
}

function novoRelatorioPDF() {
  if (!window.jspdf) { toast('A biblioteca de PDF não carregou — verifique sua internet e recarregue a página.'); throw new Error('jsPDF ausente'); }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'pt', format: 'a4' });
  const margin = 42;
  const pageWidth = doc.internal.pageSize.getWidth();
  const pageHeight = doc.internal.pageSize.getHeight();
  const maxWidth = pageWidth - margin * 2;
  let y = margin;

  function quebraPagina(extra) {
    if (y + (extra || 0) > pageHeight - margin) { doc.addPage(); y = margin; }
  }
  function titulo(texto) {
    quebraPagina(28);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(16); doc.setTextColor(18, 56, 48);
    doc.text(texto, margin, y);
    y += 10;
    doc.setDrawColor(31, 111, 92); doc.setLineWidth(1.3);
    doc.line(margin, y, margin + 70, y);
    y += 20;
    doc.setTextColor(20, 33, 29);
  }
  function secao(texto) {
    quebraPagina(26);
    y += 8;
    doc.setFont('helvetica', 'bold'); doc.setFontSize(11.5); doc.setTextColor(18, 56, 48);
    doc.text(texto.toUpperCase(), margin, y);
    y += 8;
    doc.setDrawColor(221, 226, 220); doc.setLineWidth(0.6);
    doc.line(margin, y, pageWidth - margin, y);
    y += 14;
    doc.setTextColor(20, 33, 29);
  }
  function campo(label, valor) {
    const texto = (valor === null || valor === undefined || valor === '') ? '—' : String(valor);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(9.3); doc.setTextColor(84, 101, 93);
    const labelTexto = label + ':';
    const labelWidth = doc.getTextWidth(labelTexto);
    const colunaValor = 135; // largura padrão reservada para o rótulo
    // rótulos compridos (ex.: "Cartão Nacional de Saúde (CNS)") não cabem na coluna
    // padrão — nesse caso o valor desce para a linha de baixo, em vez de sobrepor.
    const rotuloLongo = labelWidth > colunaValor - 10;
    const larguraValor = rotuloLongo ? maxWidth : maxWidth - colunaValor;
    const linhas = doc.splitTextToSize(texto, larguraValor);
    quebraPagina(linhas.length * 12.5 + (rotuloLongo ? 12.5 : 0) + 3);
    doc.text(labelTexto, margin, y);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(20, 33, 29);
    if (rotuloLongo) {
      y += 12.5;
      doc.text(linhas, margin, y);
    } else {
      doc.text(linhas, margin + colunaValor, y);
    }
    y += Math.max(14, linhas.length * 12.5) + 3;
  }
  function paragrafo(texto) {
    const linhas = doc.splitTextToSize(String(texto || '—'), maxWidth);
    quebraPagina(linhas.length * 12.5 + 4);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(20, 33, 29);
    doc.text(linhas, margin, y);
    y += linhas.length * 12.5 + 6;
  }
  function link(texto, url) {
    quebraPagina(14);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(31, 111, 92);
    doc.textWithLink(texto, margin, y, { url });
    doc.setTextColor(20, 33, 29);
    y += 14;
  }
  function espaco(px) { y += (px || 8); }
  function subitem(texto) { paragrafo('•  ' + texto); }
  function rodape() {
    const total = doc.internal.getNumberOfPages();
    for (let i = 1; i <= total; i++) {
      doc.setPage(i);
      doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(139, 151, 143);
      doc.text(`Clínica-Escola · gerado em ${new Date().toLocaleString('pt-BR')} por ${usuarioAtual()} · página ${i} de ${total}`, margin, pageHeight - 20);
    }
  }
  return { doc, titulo, secao, campo, paragrafo, subitem, link, espaco, quebraPagina, rodape };
}

function blocoDadosPaciente(r, paciente) {
  r.campo('Paciente', `${paciente.nome} (${paciente.codigo})`);
  r.campo('CPF', paciente.cpf);

  r.campo('Sexo', paciente.sexo);
  r.campo('Cor/etnia', paciente.cor_etnia);
  r.campo('Cartão Nacional de Saúde (CNS)', paciente.cns);
  r.campo('Telefone', paciente.telefone);
  r.campo('Endereço', paciente.endereco);
  r.campo('Município', paciente.municipio);
}

function blocoFichaSUSVisita(r, a) {
  r.campo('Clínica', a.clinica);
  r.campo('Horário', a.horario);
  r.campo('Tipo de consulta', a.tipo_consulta);
  r.campo('Prontuário (SUS)', a.prontuario_sus);
  r.campo('Aluno', a.aluno);
  r.campo('RA do aluno', a.aluno_ra);

function blocoHistoricoAlteracoes(r, logs) {
  const relevantes = logs.filter(l => l.campo);
  if (!relevantes.length) { r.paragrafo('Nenhuma alteração registrada.'); return; }
  relevantes.forEach(l => {
    r.subitem(`${l.criado_em} — ${l.campo}: "${l.valor_anterior || '—'}" para "${l.valor_novo || '—'}" (${l.usuario})`);
  });
}

function blocoDenteProcedimento(r, lista) {
  if (!lista.length) { r.paragrafo('Nenhum procedimento registrado.'); return; }
  lista.forEach(d => r.subitem(`Dente ${d.dente || '—'} — ${d.procedimento || 'sem descrição'}`));
}

// Resumo curto de segurança (alergias, medicamentos, condições relevantes), usado no
// relatório de UM atendimento — a ficha completa fica no relatório do paciente.
function blocoResumoAnamneseSeguranca(r, an) {
  if (!an) { r.paragrafo('Anamnese ainda não preenchida para este paciente.'); return; }

  r.campo('Medicamento em uso', an.medicamento_atual ? (an.medicamento_atual_qual || 'Sim (não especificado)') : 'Não relatado');
  r.campo('Cardiopatia', simNaoTexto(an.doenca_cardiopatia));
  r.campo('Diabete', simNaoTexto(an.doenca_diabete));
  r.campo('Hemorragia / transfusão prévia', (an.doenca_hemorragia || an.transfusao_sanguinea) ? 'Sim' : 'Não');
  r.campo('Gestante', simNaoTexto(an.esta_gravida));

}

// Ficha de anamnese e exame físico completa — usada no relatório completo do paciente.
function blocoAnamneseCompleta(r, an) {
  if (!an) { r.paragrafo('Anamnese ainda não preenchida para este paciente.'); return; }

  r.campo('R.G.', an.rg); r.campo('Idade', an.idade); r.campo('Estado civil', an.estado_civil);
  r.campo('Bairro', an.bairro); r.campo('CEP', an.cep);
  r.campo('Outro telefone (recado)', an.outro_telefone); r.campo('Falar com', an.falar_com);
  r.campo('Profissão', an.profissao); r.campo('Local de trabalho', an.local_trabalho);
  r.campo('Endereço do trabalho', an.endereco_trabalho); r.campo('Telefone do trabalho', an.telefone_trabalho);
  r.campo('Nacionalidade', an.nacionalidade); r.campo('Naturalidade', an.naturalidade); r.campo('Procedência', an.procedencia);
  r.campo('Pai', `${an.pai_nome || '—'}${an.pai_nacionalidade ? ' (' + an.pai_nacionalidade + ')' : ''}`);
  r.campo('Mãe', `${an.mae_nome || '—'}${an.mae_nacionalidade ? ' (' + an.mae_nacionalidade + ')' : ''}`);
  r.campo('Contato de emergência', `${an.contato_emergencia_nome || '—'}${an.contato_emergencia_telefone ? ' · ' + an.contato_emergencia_telefone : ''}${an.contato_emergencia_endereco ? ' · ' + an.contato_emergencia_endereco : ''}`);

  r.espaco(4);
  r.campo('Autorização — documento', `${an.autorizacao_documento_tipo || '—'} ${an.autorizacao_documento_numero || ''}`.trim());
  r.campo('Autorização — data', an.autorizacao_data);
  r.campo('Autorização — assinatura coletada', an.autorizacao_assinatura_coletada ? 'Sim' : 'Não');

  r.espaco(6);
  r.campo('Fazendo tratamento médico', `${simNaoTexto(an.tratamento_medico)}${an.tratamento_medico_detalhe ? ' — ' + an.tratamento_medico_detalhe : ''}`);
  r.campo('Medicamento em uso', `${simNaoTexto(an.medicamento_atual)}${an.medicamento_atual_qual ? ' — ' + an.medicamento_atual_qual : ''}`);
  r.campo('Cirurgia prévia', `${simNaoTexto(an.cirurgia)}${an.cirurgia_detalhe ? ' — ' + an.cirurgia_detalhe : ''}`);
  r.campo('Transfusão sanguínea', `${simNaoTexto(an.transfusao_sanguinea)}${an.transfusao_quando ? ' — ' + an.transfusao_quando : ''}${an.teve_hemorragia_transfusao ? ' (teve hemorragia)' : ''}`);
  r.campo('Radioterapia', `${simNaoTexto(an.radioterapia)}${an.radioterapia_detalhe ? ' — ' + an.radioterapia_detalhe : ''}`);
  r.campo('Regime alimentar especial', `${simNaoTexto(an.regime_alimentar)}${an.regime_alimentar_detalhe ? ' — ' + an.regime_alimentar_detalhe : ''}`);

  const doencas = [

  r.campo('Outra doença mencionada', an.outra_doenca);

  r.campo('Método contraceptivo / período', `${an.metodo_contraceptivo || '—'}${an.periodo_menstrual ? ' · ' + an.periodo_menstrual : ''}`);

  r.campo('Já fez tratamento odontológico', `${simNaoTexto(an.ja_fez_tratamento_odontologico)}${an.problema_tratamento_odontologico ? ' — ' + an.problema_tratamento_odontologico : ''}`);
  r.campo('Higiene bucal', `Escovação: ${an.higiene_escovacao_freq || '—'} · Fio dental: ${an.higiene_fio_dental_freq || '—'} · Enxaguatório: ${an.higiene_enxaguatorio_freq || '—'}`);
  r.campo('Gengiva sangra / boca seca', `${simNaoTexto(an.gengiva_sangra)} / ${simNaoTexto(an.boca_seca)}`);
  r.campo('Dificuldade em mastigar / dentes moles', `${simNaoTexto(an.dificuldade_mastigar)} / ${simNaoTexto(an.dentes_moles)}`);
  r.campo('Usa aparelho protético', simNaoTexto(an.usa_aparelho_protetico));
  if (an.usa_aparelho_protetico) {
    r.campo('Prótese superior / inferior', `${an.protese_tipo_superior || '—'} / ${an.protese_tipo_inferior || '—'}`);
    r.campo('Trocas efetuadas', an.protese_trocas_efetuadas);
    r.campo('Condição da prótese', `${an.protese_condicao || '—'}${an.protese_motivo ? ' — ' + an.protese_motivo : ''}`);
  }

  r.espaco(6);
  r.campo('Fumante / ex-fumante', `${simNaoTexto(an.fumante)}${an.fumante_tempo ? ' (' + an.fumante_tempo + ')' : ''} / ${simNaoTexto(an.ex_fumante)}${an.ex_fumante_tempo ? ' (' + an.ex_fumante_tempo + ')' : ''}`);
  r.campo('Álcool / ex-etilista', `${simNaoTexto(an.etilista)}${an.etilista_tempo ? ' (' + an.etilista_tempo + ')' : ''} / ${simNaoTexto(an.ex_etilista)}${an.ex_etilista_tempo ? ' (' + an.ex_etilista_tempo + ')' : ''}`);
  r.campo('Outros hábitos', an.outros_habitos);

  r.espaco(6);
  r.campo('Exame físico — PA / temperatura / pulso', `${an.exame_pressao_arterial || '—'} / ${an.exame_temperatura || '—'} / ${an.exame_pulso || '—'}`);

}

function blocoLesoes(r, lesoes) {
  if (!lesoes.length) { r.paragrafo('Nenhuma lesão registrada.'); return; }
  lesoes.forEach((l, i) => {
    if (i > 0) r.espaco(6);
    r.campo('Região', `${l.regioes_stomatograma.nome}${l.regioes_stomatograma.lado && l.regioes_stomatograma.lado !== 'central' ? ' · ' + l.regioes_stomatograma.lado : ''}`);
    r.campo('Lesão fundamental', l.lesao_fundamental);
    r.campo('Tamanho', l.tamanho);
    r.campo('Localização', l.localizacao);
    r.campo('Duração', l.duracao);
    r.campo('Coloração', l.coloracao);
    r.campo('Superfície', l.superficie);
    r.campo('Consistência', l.consistencia);
    r.campo('Sensibilidade', l.sensibilidade);
    r.campo('Formato', l.formato);
    r.campo('Limite', l.limite);
    r.campo('Número', l.numero);
    r.campo('Lateralidade', l.lateralidade);
    r.campo('Observações', l.observacoes);
  });
}

function blocoDocumentos(r, documentos) {
  if (!documentos.length) { r.paragrafo('Nenhum documento anexado.'); return; }
  documentos.forEach(d => {
    r.campo(d.categoria || 'Documento', d.nome_arquivo + (d.descricao ? ' — ' + d.descricao : ''));
    r.link('Abrir arquivo', publicUrlDoc(d.storage_path));
    r.espaco(4);
  });
}

// Relatório de UM atendimento específico
async function gerarRelatorioAtendimento(atendimentoId, pacienteId) {
  toast('Gerando relatório...');
  const paciente = await sb(sbClient.from('pacientes').select('*').eq('id', pacienteId).single());
  const a = await sb(sbClient.from('atendimentos').select('*, especialidades(nome)').eq('id', atendimentoId).single());
  const lesoes = await sb(sbClient.from('lesoes_estomatologicas')
    .select('*, regioes_stomatograma(nome, lado, painel)').eq('atendimento_id', atendimentoId).order('id'));
  const documentos = await sb(sbClient.from('documentos').select('*').eq('atendimento_id', atendimentoId).order('id'));
  const dentesProc = await sb(sbClient.from('procedimentos_dente').select('*').eq('atendimento_id', atendimentoId).order('id'));
  const logs = await sb(sbClient.from('auditoria').select('*').eq('atendimento_id', atendimentoId).order('id'));
  const anamnese = await fetchAnamnese(pacienteId);

  const r = novoRelatorioPDF();
  r.titulo('Relatório de Atendimento Odontológico');
  r.campo('Atendimento', `#${a.id} — sessão ${a.numero_sessao}`);
  r.campo('Especialidade', a.especialidades?.nome);
  r.campo('Data', a.criado_em);
  r.campo('Status', a.status === 'concluido' ? `Concluído${a.concluido_em ? ' em ' + a.concluido_em : ''}` : 'Em andamento');

  r.secao('Dados do paciente (Ficha SUS)');
  blocoDadosPaciente(r, paciente);

  r.secao('Ficha SUS — controle da visita');
  blocoFichaSUSVisita(r, a);

  r.secao(`Dente / Procedimento (${dentesProc.length})`);
  blocoDenteProcedimento(r, dentesProc);

  r.secao('Resumo de segurança (anamnese do paciente)');
  blocoResumoAnamneseSeguranca(r, anamnese);

  r.secao('Queixa e história');
  r.campo('Queixa principal', a.queixa_principal);
  r.paragrafo(a.hda);

  r.secao('Avaliação clínica');
  r.campo('Achados clínicos', null); r.paragrafo(a.achados_clinicos);
  r.campo('Procedimentos', null); r.paragrafo(a.procedimentos);
  r.campo('Evolução', null); r.paragrafo(a.evolucao);
  r.campo('Hipótese diagnóstica', a.hipotese_diagnostica);
  r.campo('Diagnóstico', a.diagnostico);

  if (a.especialidades?.nome === 'Estomatologia') {
    r.secao(`Lesões do Estomatograma (${lesoes.length})`);
    blocoLesoes(r, lesoes);
  }

  r.secao(`Documentos anexados (${documentos.length})`);
  blocoDocumentos(r, documentos);

  r.secao('Histórico de alterações');
  blocoHistoricoAlteracoes(r, logs);

  r.rodape();
  const nomeArquivo = `Relatorio_Atendimento_${a.id}_${slugNomeArquivo(paciente.nome)}.pdf`;
  r.doc.save(nomeArquivo);
  await logAcao('gerou_relatorio', 'atendimento', atendimentoId);
  toast('Relatório baixado');
}

// Ficha completa do paciente — todos os atendimentos, encaminhamentos e documentos
async function gerarRelatorioCompletoPaciente(pacienteId) {
  toast('Gerando ficha completa...');
  const paciente = await sb(sbClient.from('pacientes').select('*').eq('id', pacienteId).single());
  const atendimentos = await sb(sbClient.from('atendimentos')
    .select('*, especialidades(nome)').eq('paciente_id', pacienteId).order('id'));
  const encaminhamentos = await sb(sbClient.from('encaminhamentos').select('*').eq('paciente_id', pacienteId).order('id'));
  const documentosGerais = await sb(sbClient.from('documentos')
    .select('*').eq('paciente_id', pacienteId).is('atendimento_id', null).order('id'));
  const anamnese = await fetchAnamnese(pacienteId);

  const r = novoRelatorioPDF();
  r.titulo('Ficha Completa do Paciente');
  blocoDadosPaciente(r, paciente);

  r.secao('Anamnese e exame físico (triagem)');
  blocoAnamneseCompleta(r, anamnese);

  r.secao(`Histórico de atendimentos (${atendimentos.length})`);
  if (!atendimentos.length) r.paragrafo('Nenhum atendimento registrado.');
  for (let i = 0; i < atendimentos.length; i++) {
    const a = atendimentos[i];
    if (i > 0) r.espaco(12);
    r.campo('Atendimento', `#${a.id} — sessão ${a.numero_sessao} — ${a.especialidades?.nome || 'sem especialidade'}`);
    r.campo('Status', a.status === 'concluido' ? `Concluído${a.concluido_em ? ' em ' + a.concluido_em : ''}` : 'Em andamento');
    r.campo('Data', a.criado_em);
    r.campo('Clínica / Horário', `${a.clinica || '—'} / ${a.horario || '—'}`);
    r.campo('Tipo de consulta', a.tipo_consulta);
    r.campo('Prontuário (SUS)', a.prontuario_sus);
    r.campo('Aluno (RA)', `${a.aluno || '—'}${a.aluno_ra ? ' (' + a.aluno_ra + ')' : ''}`);
    r.campo('Professor / CD responsável', `${a.professor || '—'} / ${a.cd_responsavel || '—'}`);
    r.campo('Responsável pelo preenchimento', a.responsavel_preenchimento);

    const dentesProc = await sb(sbClient.from('procedimentos_dente').select('*').eq('atendimento_id', a.id).order('id'));
    if (dentesProc.length) {
      r.campo('Dente / Procedimento', null);
      dentesProc.forEach(d => r.subitem(`Dente ${d.dente || '—'} — ${d.procedimento || 'sem descrição'}`));
    }

    if (a.alergias || a.comorbidades || a.medicamentos || a.habitos) {
      r.campo('Anamnese básica registrada neste atendimento (registro antigo)', null);
      blocoAnamneseBasica(r, a);
    }

    r.campo('Queixa principal', a.queixa_principal);
    r.paragrafo('Achados clínicos: ' + (a.achados_clinicos || '—'));
    r.paragrafo('Procedimentos: ' + (a.procedimentos || '—'));
    r.paragrafo('Evolução: ' + (a.evolucao || '—'));
    r.campo('Hipótese diagnóstica', a.hipotese_diagnostica);
    r.campo('Diagnóstico', a.diagnostico);

    if (a.especialidades?.nome === 'Estomatologia') {
      const lesoes = await sb(sbClient.from('lesoes_estomatologicas')
        .select('*, regioes_stomatograma(nome, lado, painel)').eq('atendimento_id', a.id).order('id'));
      if (lesoes.length) {
        r.campo('Lesões (Estomatograma)', null);
        lesoes.forEach(l => r.subitem(`${l.regioes_stomatograma.nome}${l.regioes_stomatograma.lado && l.regioes_stomatograma.lado !== 'central' ? ' · ' + l.regioes_stomatograma.lado : ''} — ${[l.lesao_fundamental, l.tamanho, l.coloracao, l.duracao].filter(Boolean).join(', ') || 'sem detalhes preenchidos'}`));
      }
    }

    const docsAtd = await sb(sbClient.from('documentos').select('*').eq('atendimento_id', a.id).order('id'));
    if (docsAtd.length) {
      r.campo('Documentos deste atendimento', null);
      docsAtd.forEach(d => r.link(`${d.categoria || 'Documento'}: ${d.nome_arquivo}`, publicUrlDoc(d.storage_path)));
    }
  }

  r.secao(`Encaminhamentos (${encaminhamentos.length})`);
  if (!encaminhamentos.length) r.paragrafo('Nenhum encaminhamento registrado.');
  encaminhamentos.forEach((en, i) => {
    if (i > 0) r.espaco(6);
    r.campo(en.origem_tipo === 'ubs' ? 'UBS' : 'Clínica particular', en.nome_origem);
    r.campo('Responsável', en.responsavel);
    r.campo('Motivo', en.motivo);
    r.campo('Status / Data', `${en.status} — ${en.criado_em}`);
  });

  r.secao(`Documentos gerais do paciente (${documentosGerais.length})`);
  blocoDocumentos(r, documentosGerais);

  r.rodape();
  const nomeArquivo = `Ficha_Completa_${slugNomeArquivo(paciente.nome)}.pdf`;
  r.doc.save(nomeArquivo);
  await logAcao('gerou_relatorio', 'paciente', pacienteId);
  toast('Ficha completa baixada');
}

// ============================= DOCUMENTOS / ANEXOS =============================
const CATEGORIAS_DOC = ['Fotografia', 'Radiografia', 'Exame', 'Documento', 'Imagem de lesão', 'Outro'];
const LIMITE_DOC_BYTES = 25 * 1024 * 1024; // 25MB, mesmo limite configurado no bucket

function formatBytes(bytes) {
  if (!bytes) return '';
  const mb = bytes / (1024 * 1024);
  if (mb >= 1) return mb.toFixed(1) + ' MB';
  return Math.max(1, Math.round(bytes / 1024)) + ' KB';
}

function publicUrlDoc(path) {
  return sbClient.storage.from('documentos').getPublicUrl(path).data.publicUrl;
}

function renderDocumentosCards(docs) {
  if (!docs.length) return `<div class="empty-state">Nenhum documento anexado ainda.</div>`;
  return `<div style="display:flex;flex-wrap:wrap;gap:12px;">` + docs.map(d => {
    const url = publicUrlDoc(d.storage_path);
    const isImg = d.tipo_mime && d.tipo_mime.startsWith('image/');
    const isPdf = d.tipo_mime === 'application/pdf';
    return `
      <div style="width:150px;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:#fff;">
        <div data-view-doc="${d.id}" style="cursor:pointer;" title="Abrir ${d.nome_arquivo} com a descrição completa">
          ${isImg
            ? `<img src="${url}" style="width:100%;height:100px;object-fit:cover;display:block;">`
            : `<div style="width:100%;height:100px;background:var(--surface-alt);display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-faint);">${isPdf ? 'PDF' : 'ARQUIVO'}</div>`}
        </div>
        <div style="padding:8px;">
          <div data-view-doc="${d.id}" style="cursor:pointer;font-size:11.5px;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${d.nome_arquivo}">${d.nome_arquivo}</div>
          <div style="font-size:10px;color:var(--ink-faint);margin:2px 0 6px;">${d.categoria || 'Sem categoria'}${d.tamanho_bytes ? ' · ' + formatBytes(d.tamanho_bytes) : ''}</div>
          <button class="btn btn-danger btn-sm" style="width:100%;" data-del-doc="${d.id}" data-del-path="${d.storage_path}">Remover</button>
        </div>
      </div>`;
  }).join('') + `</div>`;
}

// Abre o documento (foto/PDF/arquivo) junto com toda a descrição dele, num painel grande.
function abrirDocumentoModal(doc) {
  const url = publicUrlDoc(doc.storage_path);
  const isImg = doc.tipo_mime && doc.tipo_mime.startsWith('image/');
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(20,33,29,.72);z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;';
  overlay.innerHTML = `
    <div style="background:#fff;border-radius:12px;max-width:920px;width:100%;max-height:88vh;overflow:auto;display:flex;flex-wrap:wrap;">
      <div style="flex:1.2;min-width:280px;background:var(--surface-alt);display:flex;align-items:center;justify-content:center;padding:16px;">
        ${isImg
          ? `<img src="${url}" style="max-width:100%;max-height:65vh;border-radius:6px;display:block;">`
          : `<div style="text-align:center;padding:40px 20px;">
               <div style="font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ink-faint);margin-bottom:14px;">${doc.tipo_mime === 'application/pdf' ? 'Documento PDF' : (doc.tipo_mime || 'Arquivo')}</div>
               <a class="btn btn-primary btn-sm" href="${url}" target="_blank" rel="noopener">Abrir arquivo</a>
             </div>`}
      </div>
      <div style="flex:1;min-width:260px;padding:22px;">
        <h3 style="margin:0 0 6px;word-break:break-word;">${doc.nome_arquivo}</h3>
        <span class="badge badge-code" style="margin-bottom:14px;display:inline-block;">${doc.categoria || 'Sem categoria'}</span>
        <table>
          <tr><td class="muted" style="width:38%">Descrição</td><td>${doc.descricao || '—'}</td></tr>
          <tr><td class="muted">Tamanho</td><td>${formatBytes(doc.tamanho_bytes) || '—'}</td></tr>
          <tr><td class="muted">Enviado por</td><td>${doc.enviado_por || '—'}</td></tr>
          <tr><td class="muted">Data</td><td class="mono">${doc.criado_em}</td></tr>
        </table>
        <div style="margin-top:16px;display:flex;gap:8px;">
          <a class="btn btn-ghost btn-sm" href="${url}" target="_blank" rel="noopener">Abrir em nova aba</a>
          <button class="btn btn-ghost btn-sm" id="fechar-doc-modal">Fechar</button>
        </div>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
  overlay.querySelector('#fechar-doc-modal').addEventListener('click', () => overlay.remove());
}

function formularioUploadHtml(idPrefix, lesoes) {
  return `
    <div class="grid2" style="margin-top:8px;">
      <div class="field"><label>Arquivo (até 25MB)</label><input type="file" id="${idPrefix}-file"></div>
      <div class="field"><label>Categoria</label>
        <select id="${idPrefix}-categoria">${CATEGORIAS_DOC.map(c => `<option>${c}</option>`).join('')}</select>
      </div>
      ${lesoes && lesoes.length ? `
      <div class="field" style="grid-column:1/-1"><label>Vincular a uma lesão do Estomatograma (opcional)</label>
        <select id="${idPrefix}-lesao">
          <option value="">Nenhuma</option>
          ${lesoes.map(l => `<option value="${l.id}">${l.regioes_stomatograma.nome}${l.regioes_stomatograma.lado && l.regioes_stomatograma.lado !== 'central' ? ' · ' + l.regioes_stomatograma.lado : ''}</option>`).join('')}
        </select>
      </div>` : ''}
      <div class="field" style="grid-column:1/-1"><label>Descrição</label><input id="${idPrefix}-desc" placeholder="opcional"></div>
    </div>
    <button class="btn btn-primary btn-sm" id="${idPrefix}-btn">Enviar arquivo</button>
  `;
}

function wireUploadForm(idPrefix, { paciente_id, atendimento_id }, onDone) {
  const btn = document.getElementById(`${idPrefix}-btn`);
  if (!btn) return;
  btn.addEventListener('click', async () => {
    const fileInput = document.getElementById(`${idPrefix}-file`);
    const file = fileInput.files[0];
    if (!file) { toast('Escolha um arquivo primeiro'); return; }
    if (file.size > LIMITE_DOC_BYTES) { toast('Arquivo maior que 25MB — não é possível enviar'); return; }

    btn.disabled = true; btn.textContent = 'Enviando...';
    try {
      const categoria = document.getElementById(`${idPrefix}-categoria`).value;
      const desc = v(`${idPrefix}-desc`);
      const lesaoSel = document.getElementById(`${idPrefix}-lesao`);
      const lesao_id = lesaoSel && lesaoSel.value ? lesaoSel.value : null;

      const nomeSeguro = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
      const path = `${paciente_id}/${atendimento_id || 'geral'}/${Date.now()}_${nomeSeguro}`;

      await sb(sbClient.storage.from('documentos').upload(path, file, { contentType: file.type || 'application/octet-stream' }));

      const doc = await sb(sbClient.from('documentos').insert({
        paciente_id, atendimento_id: atendimento_id || null, lesao_id,
        nome_arquivo: file.name, tipo_mime: file.type || null, categoria,
        storage_path: path, tamanho_bytes: file.size, descricao: desc, enviado_por: usuarioAtual(),
      }).select().single());

      await logAcao('anexou', 'documento', doc.id);
      toast('Arquivo enviado');
      onDone();
    } finally {
      btn.disabled = false; btn.textContent = 'Enviar arquivo';
    }
  });
}

function wireDocumentosCards(docs, onDeleteDone) {
  const porId = Object.fromEntries(docs.map(d => [String(d.id), d]));
  document.querySelectorAll('[data-view-doc]').forEach(el => {
    el.addEventListener('click', () => abrirDocumentoModal(porId[el.dataset.viewDoc]));
  });
  document.querySelectorAll('[data-del-doc]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      if (!confirm('Remover este documento? Essa ação não pode ser desfeita.')) return;
      await sb(sbClient.storage.from('documentos').remove([btn.dataset.delPath]));
      await sb(sbClient.from('documentos').delete().eq('id', btn.dataset.delDoc));
      await logAcao('removeu', 'documento', btn.dataset.delDoc);
      toast('Documento removido');
      onDeleteDone();
    });
  });
}

// ============================= STOMATOGRAMA =============================
async function renderStomatograma() {
  await ensureRegioes();
  // só atendimentos cuja especialidade é Estomatologia (item 3 dos requisitos)
  const atendimentos = await sb(sbClient.from('atendimentos')
    .select('*, especialidades!inner(nome), pacientes(codigo)')
    .eq('especialidades.nome', 'Estomatologia')
    .order('id', { ascending: false }));

  const atendimentosOptions = atendimentos.map(a =>
    `<option value="${a.id}" ${state.atendimentoAtual && state.atendimentoAtual.id == a.id ? 'selected' : ''}>${a.pacientes?.codigo || '?'} — atendimento #${a.id}</option>`
  ).join('');

  $main.innerHTML = `
    <div class="eyebrow">Estomatologia</div>
    <h2>Estomatograma</h2>
    <div class="card">
      <div class="muted" style="margin-bottom:10px">O Estomatograma só fica disponível para atendimentos cuja especialidade seja Estomatologia.</div>
      <div class="field" style="max-width:520px">
        <label>Atendimento</label>
        <select id="s-atendimento">
          <option value="">Selecione um atendimento...</option>
          ${atendimentosOptions}
        </select>
      </div>
      ${!atendimentosOptions ? `<div class="empty-state">Nenhum atendimento de Estomatologia encontrado ainda. Crie um atendimento escolhendo essa especialidade primeiro.</div>` : ''}
    </div>
    <div id="stoma-body"></div>
  `;

  const sel = document.getElementById('s-atendimento');
  sel.addEventListener('change', () => loadStomaFor(sel.value));
  if (state.atendimentoAtual) loadStomaFor(state.atendimentoAtual.id);
}

function findRegiaoId(nome, lado, painel) {
  const r = state.regioes.find(r => r.nome === nome && r.lado === lado && r.painel === painel);
  return r ? r.id : null;
}

async function loadStomaFor(atendimentoId) {
  if (!atendimentoId) { document.getElementById('stoma-body').innerHTML = ''; return; }
  state.atendimentoAtual = { id: atendimentoId };
  const lesoes = await sb(sbClient.from('lesoes_estomatologicas')
    .select('*, regioes_stomatograma(nome, lado, painel)').eq('atendimento_id', atendimentoId).order('id', { ascending: false }));
  renderStomaBody(atendimentoId, lesoes);
}

function renderStomaBody(atendimentoId, lesoes) {
  document.getElementById('stoma-body').innerHTML = `
    <div class="stoma-wrap">
      <div class="stoma-svg-box card">${regionSvg()}</div>
      <div class="lesoes-panel">
        <div class="card">
          <h3 style="margin:0 0 8px">Lesões registradas</h3>
          <div id="lesoes-lista">
            ${lesoes.length ? lesoes.map(l => `
              <div class="lesao-item">
                <div class="rgn">${l.regioes_stomatograma.nome}${l.regioes_stomatograma.lado && l.regioes_stomatograma.lado !== 'central' ? ' · ' + l.regioes_stomatograma.lado : ''}</div>
                <div>${[l.lesao_fundamental, l.tamanho, l.coloracao].filter(Boolean).join(' · ') || 'sem detalhes preenchidos'}</div>
                <div style="display:flex;gap:6px;margin-top:6px;">
                  <button class="btn btn-ghost btn-sm" style="flex:1;" data-ver-lesao="${l.id}">Ver / revisar</button>
                  <button class="btn btn-danger btn-sm" data-del-lesao="${l.id}">Remover</button>
                </div>
              </div>`).join('') : `<div class="empty-state">Nenhuma lesão registrada ainda. Clique em uma região do desenho.</div>`}
          </div>
        </div>
        <div class="card" id="lesao-form-box" style="display:none"></div>
      </div>
    </div>`;

  document.querySelectorAll('.region').forEach(el => {
    const nome = el.dataset.nome, lado = el.dataset.lado, painel = el.dataset.painel;
    if (lesoes.some(l => l.regioes_stomatograma.nome === nome && l.regioes_stomatograma.lado === lado)) el.classList.add('has-lesao');
    el.addEventListener('click', () => openLesaoForm(atendimentoId, nome, lado, painel, el));
  });

  document.querySelectorAll('[data-ver-lesao]').forEach(btn => {
    btn.addEventListener('click', () => {
      const lesao = lesoes.find(l => String(l.id) === btn.dataset.verLesao);
      if (!lesao) return;
      const r = lesao.regioes_stomatograma;
      const el = document.querySelector(`.region[data-nome="${cssEscape(r.nome)}"][data-lado="${cssEscape(r.lado)}"][data-painel="${cssEscape(r.painel)}"]`);
      openLesaoForm(atendimentoId, r.nome, r.lado, r.painel, el, lesao);
    });
  });

  document.querySelectorAll('[data-del-lesao]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('Remover esta lesão? Essa ação não pode ser desfeita.')) return;
      await sb(sbClient.from('lesoes_estomatologicas').delete().eq('id', btn.dataset.delLesao));
      await logAcao('removeu', 'lesao_estomatologica', btn.dataset.delLesao);
      toast('Lesão removida');
      loadStomaFor(atendimentoId);
    });
  });
}

function cssEscape(s) { return String(s).replace(/["\\]/g, '\\$&'); }

// lesaoExistente (opcional): quando informada, o formulário abre em modo de revisão/edição,
// pré-preenchido com os dados já salvos, em vez de um cadastro novo.
function openLesaoForm(atendimentoId, nome, lado, painel, el, lesaoExistente) {
  document.querySelectorAll('.region.selected').forEach(r => r.classList.remove('selected'));
  if (el) el.classList.add('selected');
  const box = document.getElementById('lesao-form-box');
  box.style.display = 'block';
  const L = lesaoExistente || {};
  const campo = (id, val) => `id="${id}" value="${val ? String(val).replace(/"/g, '&quot;') : ''}"`;
  box.innerHTML = `
    <h3 style="margin:0 0 4px">${nome}${lado && lado !== 'central' ? ' · ' + lado : ''}</h3>
    <div class="muted" style="margin-bottom:10px">${lesaoExistente ? 'Revisar / atualizar lesão já registrada' : 'Registrar nova lesão nesta região'}</div>
    <div class="field"><label>Lesão fundamental</label><input ${campo('l-fund', L.lesao_fundamental)} placeholder="ex.: úlcera, mácula, nódulo..."></div>
    <div class="field"><label>Tamanho</label><input ${campo('l-tam', L.tamanho)}></div>
    <div class="field"><label>Localização (detalhe)</label><input ${campo('l-loc', L.localizacao)}></div>
    <div class="field"><label>Duração</label><input ${campo('l-dur', L.duracao)}></div>
    <div class="field"><label>Coloração</label><input ${campo('l-cor', L.coloracao)}></div>
    <div class="field"><label>Superfície</label><input ${campo('l-sup', L.superficie)}></div>
    <div class="field"><label>Consistência</label><input ${campo('l-cons', L.consistencia)}></div>
    <div class="field"><label>Sensibilidade</label><input ${campo('l-sens', L.sensibilidade)}></div>
    <div class="field"><label>Formato</label><input ${campo('l-form', L.formato)}></div>
    <div class="field"><label>Limite</label><input ${campo('l-lim', L.limite)}></div>
    <div class="field"><label>Número</label><input ${campo('l-num', L.numero)}></div>
    <div class="field"><label>Lateralidade</label><input ${campo('l-lat', L.lateralidade || (lado && lado !== 'central' ? lado : ''))}></div>
    <div class="field"><label>Observações</label><textarea id="l-obs">${L.observacoes || ''}</textarea></div>
    <button class="btn btn-primary" id="btn-salvar-lesao">${lesaoExistente ? 'Salvar alterações' : 'Salvar lesão'}</button>
    ${lesaoExistente ? `<button class="btn btn-danger" id="btn-remover-lesao-form">Remover esta lesão</button>` : ''}
    <button class="btn btn-ghost" id="btn-cancelar-lesao">Cancelar</button>
  `;
  document.getElementById('btn-cancelar-lesao').addEventListener('click', () => { box.style.display = 'none'; if (el) el.classList.remove('selected'); });
  document.getElementById('btn-salvar-lesao').addEventListener('click', async () => {
    const payload = {
      lesao_fundamental: v('l-fund'), tamanho: v('l-tam'), localizacao: v('l-loc'), duracao: v('l-dur'),
      coloracao: v('l-cor'), superficie: v('l-sup'), consistencia: v('l-cons'), sensibilidade: v('l-sens'),
      formato: v('l-form'), limite: v('l-lim'), numero: v('l-num'), lateralidade: v('l-lat'), observacoes: v('l-obs'),
    };
    if (lesaoExistente) {
      await sb(sbClient.from('lesoes_estomatologicas').update(payload).eq('id', lesaoExistente.id));
      await logAcao('atualizou', 'lesao_estomatologica', lesaoExistente.id);
      toast('Lesão atualizada');
    } else {
      const regiao_id = findRegiaoId(nome, lado, painel);
      if (!regiao_id) { toast('Região não encontrada no banco'); return; }
      const lesao = await sb(sbClient.from('lesoes_estomatologicas').insert({ atendimento_id: atendimentoId, regiao_id, ...payload }).select().single());
      await logAcao('registrou', 'lesao_estomatologica', lesao.id);
      toast('Lesão salva no Supabase');
    }
    loadStomaFor(atendimentoId);
  });
  if (lesaoExistente) {
    document.getElementById('btn-remover-lesao-form').addEventListener('click', async () => {
      if (!confirm('Remover esta lesão? Essa ação não pode ser desfeita.')) return;
      await sb(sbClient.from('lesoes_estomatologicas').delete().eq('id', lesaoExistente.id));
      await logAcao('removeu', 'lesao_estomatologica', lesaoExistente.id);
      toast('Lesão removida');
      loadStomaFor(atendimentoId);
    });
  }
}
function v(id) { const val = document.getElementById(id).value; return val === '' ? null : val; }

async function renderEncaminhamentos() {
  const pacientes = await sb(sbClient.from('pacientes').select('id,codigo,nome').order('id', { ascending: false }));
  const lista = await sb(sbClient.from('encaminhamentos').select('*, pacientes(codigo,nome)').order('id', { ascending: false }));

  $main.innerHTML = `
    <div class="eyebrow">Comunicação externa</div>
    <h2>Encaminhamentos</h2>
    <div class="card">
      <div class="field" style="max-width:420px"><label>Paciente</label>
        <select id="enc-paciente">${pacientes.map(p => `<option value="${p.id}">${p.codigo} — ${p.nome}</option>`).join('')}</select>
      </div>
      <div class="pill-select">
        <button class="active" data-origem="ubs">UBS</button>
        <button data-origem="clinica_particular">Clínica particular</button>
      </div>
      <div id="enc-campos"></div>
      <div class="field"><label>Motivo</label><textarea id="enc-motivo"></textarea></div>
      <button class="btn btn-primary" id="btn-criar-encaminhamento">Registrar encaminhamento</button>
    </div>
    <div class="card">
      <h3 style="margin:0 0 8px">Encaminhamentos registrados</h3>
      <table>
        <tr><th>Paciente</th><th>Origem</th><th>Responsável</th><th>Status</th></tr>
        ${lista.map(e => `<tr><td>${e.pacientes?.codigo || '—'} — ${e.pacientes?.nome || '—'}</td><td><span class="badge ${e.origem_tipo === 'ubs' ? 'badge-progress' : 'badge-done'}">${e.origem_tipo === 'ubs' ? 'UBS' : 'Clínica particular'}</span></td><td>${e.nome_origem || '—'}</td><td>${e.status}</td></tr>`).join('') || `<tr><td colspan="4" class="empty-state">Nenhum encaminhamento ainda.</td></tr>`}
      </table>
    </div>
  `;

  let origemAtual = 'ubs';
  function camposUBS() {
    return `
      <div class="grid2">
        <div class="field"><label>Nome da UBS</label><input id="enc-nome"></div>
        <div class="field"><label>Profissional responsável</label><input id="enc-resp"></div>
      </div>`;
  }
  function camposParticular() {
    return `
      <div class="grid2">
        <div class="field"><label>Nome da clínica</label><input id="enc-nome"></div>
        <div class="field"><label>Cirurgião-dentista responsável</label><input id="enc-resp"></div>
        <div class="field"><label>CRO</label><input id="enc-cro"></div>
        <div class="field"><label>Telefone</label><input id="enc-tel"></div>
        <div class="field" style="grid-column:1/-1"><label>Endereço</label><input id="enc-end"></div>
      </div>`;
  }
  function renderCampos() {
    document.getElementById('enc-campos').innerHTML = origemAtual === 'ubs' ? camposUBS() : camposParticular();
  }
  renderCampos();

  document.querySelectorAll('[data-origem]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('[data-origem]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      origemAtual = btn.dataset.origem;
      renderCampos();
    });
  });

  document.getElementById('btn-criar-encaminhamento').addEventListener('click', async () => {
    const paciente_id = document.getElementById('enc-paciente').value;
    const encaminhamento = await sb(sbClient.from('encaminhamentos').insert({
      paciente_id, origem_tipo: origemAtual, motivo: v('enc-motivo'),
      nome_origem: v('enc-nome'), responsavel: v('enc-resp'),
      cro: document.getElementById('enc-cro') ? v('enc-cro') : null,
      telefone: document.getElementById('enc-tel') ? v('enc-tel') : null,
      endereco: document.getElementById('enc-end') ? v('enc-end') : null,
    }).select().single());
    await logAcao('criou', 'encaminhamento', encaminhamento.id);
    toast('Encaminhamento registrado');
    renderEncaminhamentos();
  });
}
